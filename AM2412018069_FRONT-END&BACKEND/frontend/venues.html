<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTix - Venue Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'], }, colors: { blackbg: '#050505', panel: '#0A0A0A', neongold: '#FFD700', } } } }
    </script>
</head>
<body class="text-gray-300 font-sans h-screen flex p-4 gap-6 relative">
    
    <div class="fixed inset-0 z-[-1]">
        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-40" style="background-image: url('novatix-bg.jpg');"></div>
        <div class="absolute inset-0 bg-black/85"></div>
    </div>

    <aside class="w-[280px] rounded-3xl border border-zinc-800/60 flex flex-col p-8 justify-between shadow-2xl relative overflow-hidden bg-cover bg-center" style="background-image: linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.95)), url('nova-gold.jpg');">
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-neongold opacity-10 rounded-full blur-3xl"></div>
        <div class="relative z-10">
            <div class="flex items-center gap-3 mb-12">
                <i class="fas fa-bolt text-neongold text-2xl drop-shadow-[0_0_8px_rgba(255,215,0,0.8)]"></i>
                <h1 class="text-2xl font-display font-extrabold text-white tracking-widest uppercase">
                    NOVA<span class="text-neongold drop-shadow-[0_0_8px_rgba(255,215,0,0.8)]">TIX</span>
                </h1>
            </div>
            <nav class="space-y-2">
                <a href="index.html" class="text-zinc-400 hover:text-white hover:bg-zinc-900/50 rounded-xl px-5 py-4 flex items-center gap-4 font-display font-bold text-sm tracking-widest transition duration-300">
                    <i class="fas fa-layer-group w-4 text-center"></i> EVENTS
                </a>
                <a href="venues.html" class="bg-[#141414]/80 border border-neongold/80 text-neongold rounded-xl px-5 py-4 flex items-center gap-4 font-display font-bold text-sm tracking-widest shadow-[0_0_15px_rgba(255,215,0,0.1)] backdrop-blur-sm">
                    <i class="fas fa-map-marker-alt text-neongold w-4 text-center"></i> VENUES
                </a>
                <a href="bookings.html" class="text-zinc-400 hover:text-white hover:bg-zinc-900/50 rounded-xl px-5 py-4 flex items-center gap-4 font-display font-bold text-sm tracking-widest transition duration-300">
                    <i class="fas fa-qrcode w-4 text-center"></i> BOOKINGS
                </a>
                <a href="registry.html" class="text-zinc-400 hover:text-white hover:bg-zinc-900/50 rounded-xl px-5 py-4 flex items-center gap-4 font-display font-bold text-sm tracking-widest transition duration-300">
                    <i class="fas fa-user-shield w-4 text-center"></i> REGISTRY
                </a>
            </nav>
        </div>
        <div class="relative z-10">
            <div class="mb-8 pl-4 border-l-2 border-neongold">
                <p class="font-display font-extrabold text-sm tracking-wider text-white"><span id="user-name-display">USER</span></p>
                <p id="user-role-display" class="text-neongold text-[10px] font-bold tracking-[0.2em] uppercase mt-1">ROLE</p>
            </div>
            <button onclick="disconnect()" class="w-full border border-zinc-700/80 text-zinc-300 hover:border-neongold hover:text-neongold hover:shadow-[0_0_15px_rgba(255,215,0,0.2)] transition duration-300 rounded-full py-3.5 font-display text-xs font-bold tracking-widest uppercase flex justify-center items-center gap-3 bg-black/60 backdrop-blur-sm">
                <i class="fas fa-power-off"></i> DISCONNECT
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto pr-4 pb-4 pt-4 relative z-10 flex flex-col">
        <div class="mb-8 pb-6 border-b border-zinc-800 flex justify-between items-end">
            <div>
                <h2 class="text-4xl font-display font-bold text-white tracking-wider uppercase mb-2 drop-shadow-md">Physical Nodes</h2>
                <p class="text-zinc-400 text-sm font-sans drop-shadow-md">Directory of authorized venue locations and capacities.</p>
            </div>
            <button id="btn-add-venue" onclick="openModal()" class="hidden px-6 py-3 border border-neongold bg-neongold/10 text-neongold hover:bg-neongold hover:text-black hover:shadow-[0_0_15px_rgba(255,215,0,0.4)] transition duration-300 rounded-lg font-display text-xs font-bold tracking-widest uppercase backdrop-blur-sm">
                <i class="fas fa-plus mr-2"></i> Register Venue
            </button>
        </div>

        <div id="system-message" class="hidden mb-6 p-4 rounded-lg font-display tracking-widest text-sm uppercase border backdrop-blur-sm"></div>

        <div id="venues-container" class="grid grid-cols-1 xl:grid-cols-3 lg:grid-cols-2 gap-6 flex-1">
            <p class="text-neongold animate-pulse font-display tracking-widest text-sm drop-shadow-md">SYNCING REGISTRY...</p>
        </div>

        <div id="pagination-controls" class="mt-8 pt-6 border-t border-zinc-800 flex justify-between items-center hidden">
            <button id="btn-prev" onclick="changePage(-1)" class="px-6 py-3 bg-black/50 border border-zinc-700 hover:border-neongold text-zinc-400 hover:text-neongold rounded-lg font-display text-xs tracking-widest uppercase transition">
                <i class="fas fa-chevron-left mr-2"></i> Previous
            </button>
            <span id="page-indicator" class="font-display text-sm tracking-widest text-zinc-500">PAGE 1 OF 1</span>
            <button id="btn-next" onclick="changePage(1)" class="px-6 py-3 bg-black/50 border border-zinc-700 hover:border-neongold text-zinc-400 hover:text-neongold rounded-lg font-display text-xs tracking-widest uppercase transition">
                Next <i class="fas fa-chevron-right ml-2"></i>
            </button>
        </div>
    </main>

    <div id="venue-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-panel/90 border border-zinc-800 rounded-2xl p-8 w-full max-w-lg shadow-[0_0_30px_rgba(255,215,0,0.1)] relative">
            <h3 id="modal-title" class="text-2xl font-display font-bold text-white tracking-widest uppercase mb-6">Register Node</h3>
            
            <form id="venue-form" class="space-y-4">
                <input type="hidden" id="venue-id">
                <div>
                    <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Venue Name</label>
                    <input type="text" id="venue-name" required class="w-full bg-black/50 border border-zinc-700 text-white rounded-lg py-3 px-4 focus:outline-none focus:border-neongold">
                </div>
                <div>
                    <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Physical Address</label>
                    <input type="text" id="venue-address" required class="w-full bg-black/50 border border-zinc-700 text-white rounded-lg py-3 px-4 focus:outline-none focus:border-neongold">
                </div>
                <div>
                    <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Maximum Capacity</label>
                    <input type="number" id="venue-capacity" required min="1" class="w-full bg-black/50 border border-zinc-700 text-white rounded-lg py-3 px-4 focus:outline-none focus:border-neongold">
                </div>
                <div>
                    <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Description</label>
                    <textarea id="venue-desc" rows="3" class="w-full bg-black/50 border border-zinc-700 text-white rounded-lg py-3 px-4 focus:outline-none focus:border-neongold"></textarea>
                </div>
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" onclick="closeModal()" class="px-6 py-3 border border-zinc-700 text-zinc-400 hover:text-white rounded-lg font-display text-xs font-bold tracking-widest uppercase transition">Cancel</button>
                    <button type="submit" class="px-6 py-3 border border-neongold bg-neongold/10 text-neongold hover:bg-neongold hover:text-black rounded-lg font-display text-xs font-bold tracking-widest uppercase transition">Save Venue</button>
                </div>
            </form>
        </div>
    </div>

    <script src="venues.js"></script>
</body>
</html>
