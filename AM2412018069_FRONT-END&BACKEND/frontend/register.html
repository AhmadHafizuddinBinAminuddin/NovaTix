<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTix - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Montserrat', 'sans-serif'], }, colors: { blackbg: '#050505', panel: '#0A0A0A', neongold: '#FFD700', } } } }
    </script>
</head>
<body class="text-gray-300 font-sans h-screen flex items-center justify-center p-4 relative">
    
    <div class="fixed inset-0 z-[-1]">
        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-40" style="background-image: url('novatix-bg.jpg');"></div>
        <div class="absolute inset-0 bg-black/85"></div>
    </div>

    <div class="w-full max-w-md bg-panel/60 backdrop-blur-xl rounded-3xl border border-zinc-800/60 p-8 shadow-[0_0_30px_rgba(255,215,0,0.05)] relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-neongold opacity-10 rounded-full blur-3xl"></div>

        <div class="text-center mb-8 relative z-10">
            <i class="fas fa-bolt text-neongold text-3xl drop-shadow-[0_0_8px_rgba(255,215,0,0.8)] mb-2"></i>
            <h1 class="text-3xl font-display font-extrabold text-white tracking-widest uppercase mb-1">
                NOVA<span class="text-neongold drop-shadow-[0_0_8px_rgba(255,215,0,0.8)]">TIX</span>
            </h1>
            <p class="text-neongold text-xs font-bold tracking-[0.2em] uppercase">New Citizen Registry</p>
        </div>

        <form id="register-form" class="space-y-5 relative z-10">
            <div id="message-box" class="hidden text-sm font-display tracking-widest uppercase p-3 rounded-lg text-center border"></div>

            <div>
                <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Full Name</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-zinc-500"></i>
                    <input type="text" id="fullname" required class="w-full bg-black/50 border border-zinc-700/80 text-white rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-neongold focus:shadow-[0_0_10px_rgba(255,215,0,0.2)] transition duration-300">
                </div>
            </div>

            <div>
                <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Secure Email</label>
                <div class="relative">
                    <i class="fas fa-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-zinc-500"></i>
                    <input type="email" id="email" required class="w-full bg-black/50 border border-zinc-700/80 text-white rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-neongold focus:shadow-[0_0_10px_rgba(255,215,0,0.2)] transition duration-300">
                </div>
            </div>

            <div>
                <label class="block text-xs font-display tracking-widest text-zinc-400 uppercase mb-2">Access Key (Password)</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-zinc-500"></i>
                    <input type="password" id="password" required class="w-full bg-black/50 border border-zinc-700/80 text-white rounded-xl py-3 pl-12 pr-4 focus:outline-none focus:border-neongold focus:shadow-[0_0_10px_rgba(255,215,0,0.2)] transition duration-300">
                </div>
            </div>

            <button type="submit" class="w-full mt-4 border border-neongold bg-neongold/10 text-neongold hover:bg-neongold hover:text-black hover:shadow-[0_0_20px_rgba(255,215,0,0.4)] transition duration-300 rounded-xl py-4 font-display text-xs font-bold tracking-widest uppercase">
                Initialize Profile
            </button>
            
            <p class="text-center text-xs font-display tracking-widest text-zinc-500 mt-4">
                ALREADY REGISTERED? <a href="login.html" class="text-neongold hover:underline">ACCESS NODE</a>
            </p>
        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
